<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Free Subagents">
  <title>Free Subagents</title>
  <!--
    A routing fork: one request in, three free routes out. The arrowheads are
    the failover paths. Bold and digital ink plate, brand cyan glyph.
  -->
  <defs>
    <linearGradient id="fs-plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#091c36"/>
      <stop offset="1" stop-color="#05121f"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#fs-plate)"/>

  <!-- the trunk and the three routes it can take -->
  <g fill="none" stroke="#57ebee" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M15 32h11"/>
    <path d="M26 32c0 0 6-13 15-13"/>
    <path d="M26 32c0 0 6 0 15 0"/>
    <path d="M26 32c0 0 6 13 15 13"/>
  </g>

  <!-- the source request -->
  <circle cx="13" cy="32" r="4.5" fill="#57ebee"/>

  <!-- the three destinations -->
  <g fill="#57ebee">
    <circle cx="45" cy="19" r="4.5"/>
    <circle cx="45" cy="32" r="4.5"/>
    <circle cx="45" cy="45" r="4.5"/>
  </g>

  <!-- monogram -->
  <rect x="36" y="42" width="24" height="18" rx="6" fill="#091c36" stroke="#57ebee" stroke-width="2"/>
  <text x="48" y="55" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.3">FS</text>
</svg>
